@if (player.station(); as current) {
  <aside
    class="fixed inset-x-0 bottom-0 z-[70] border-t border-stone-200/80 bg-paper-50/95 shadow-[0_-18px_60px_-24px_rgba(0,0,0,0.35)] backdrop-blur-2xl dark:border-white/10 dark:bg-ink-950/95"
    aria-label="Radio player"
  >
    <div class="h-1 w-full bg-stone-200/70 dark:bg-white/10">
      <div
        class="h-full bg-brand-500 transition-[width] duration-500"
        [style.width.%]="progress()"
      ></div>
    </div>

    <div class="app-container flex flex-col gap-3 py-3 sm:flex-row sm:items-center sm:gap-4">
      <a
        [routerLink]="['/stations', current.slug]"
        class="flex min-w-0 items-center gap-3"
        aria-label="Open {{ current.name }}"
      >
        <img
          [src]="artworkUrl(current)"
          [alt]="current.name + ' artwork'"
          class="h-12 w-12 shrink-0 rounded-xl border border-stone-200/80 object-cover shadow-sm dark:border-white/10"
        />
        <div class="min-w-0">
          <p class="truncate font-display text-sm font-semibold text-ink-900 dark:text-white">
            {{ current.name }}
          </p>
          <p
            [class]="player.playing()
              ? 'mt-0.5 flex items-center gap-1.5 text-[0.65rem] font-bold uppercase tracking-[0.14em] text-brand-700 dark:text-brand-300'
              : 'mt-0.5 flex items-center gap-1.5 text-[0.65rem] font-bold uppercase tracking-[0.14em] text-stone-500'"
          >
            @if (player.playing()) {
              <span class="live-dot h-1.5 w-1.5 rounded-full bg-brand-500"></span>
              On air
            } @else if (player.loading()) {
              Connecting…
            } @else {
              Paused
            }
          </p>
        </div>
      </a>

      <div class="flex min-w-0 flex-1 items-center gap-3">
        <button
          type="button"
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-brand-600 text-white shadow-lg shadow-brand-900/20 transition-colors hover:bg-brand-500 disabled:opacity-60"
          [disabled]="player.loading()"
          [attr.aria-label]="player.playing() ? 'Pause ' + current.name : 'Play ' + current.name"
          (click)="player.togglePlay()"
        >
          @if (player.loading()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="h-5 w-5 animate-spin">
              <path d="M21 12a9 9 0 1 1-6.2-8.56" stroke-linecap="round" />
            </svg>
          } @else if (player.playing()) {
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="h-5 w-5">
              <rect x="7" y="5" width="3.5" height="14" rx="1" />
              <rect x="13.5" y="5" width="3.5" height="14" rx="1" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="ml-0.5 h-5 w-5">
              <path d="M8 5.5v13l10-6.5Z" />
            </svg>
          }
        </button>

        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-3 text-[0.68rem] font-semibold tabular-nums text-stone-500 dark:text-stone-400">
            <span>{{ formatTime(player.elapsed()) }}</span>
            <span>{{ formatTime(player.duration()) }}</span>
          </div>
          <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-stone-200/80 dark:bg-white/10">
            <div
              class="h-full rounded-full bg-brand-500 transition-[width] duration-1000"
              [style.width.%]="progress()"
            ></div>
          </div>
          @if (player.error()) {
            <p class="mt-1 truncate text-[0.68rem] font-medium text-red-600 dark:text-red-300" role="status">
              {{ player.error() }}
            </p>
          }
        </div>
      </div>

      <div class="flex items-center justify-between gap-3 sm:justify-end">
        <label class="flex items-center gap-2" aria-label="Radio volume">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="h-4 w-4 text-stone-500 dark:text-stone-400">
            <path d="M11 5 6 9H3v6h3l5 4Z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            <path d="M18.5 6a8.5 8.5 0 0 1 0 12" />
          </svg>
          <input
            type="range"
            min="0"
            max="100"
            step="1"
            class="h-1.5 w-20 cursor-pointer accent-brand-600"
            [value]="player.volume() * 100"
            (input)="onVolumeInput($event)"
          />
        </label>
        <button
          type="button"
          class="icon-button h-9 w-9"
          aria-label="Close radio player"
          title="Close radio player"
          (click)="player.close()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="h-4 w-4">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
    </div>
  </aside>
}
